[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifs-chatbot"
version = "0.1.0"
description = "IFS 심상화 연구 유도 면담 서버 — 고정 문구 + 로컬 LLM clean 질문 + 결정론적 검증기 + 안전 계층"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "kiwipiepy>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ifs_chatbot"]

[tool.setuptools.package-data]
ifs_chatbot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 로컬 Ollama 모델이 있어야 도는 테스트 (IFS_LIVE=1일 때만)"]
