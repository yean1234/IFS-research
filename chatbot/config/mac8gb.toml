# 메모리 8GB 맥(M1) 점검용 설정. 연구 조건이 아니다.
# gemma4:e4b는 num_ctx 8192에서 약 8.8GiB가 필요해 8GB 맥에 올라가지 않는다. 같은 계열 E2B(QAT)로 내리고 문맥을 줄인다.
# 실행: python -m ifs_chatbot.server --config mac8gb

[llm]
backend = "ollama"
model = "gemma4:e2b-it-qat"   # 약 4.3GB
num_ctx = 4096                # 시스템 프롬프트 + 단계 블록 + 대화 이력에 충분
keep_alive = "30m"

[guard]
model_backend = "none"        # 가드 모델(약 5GB)은 함께 올릴 수 없다. 키워드 사전만으로 검사한다.
