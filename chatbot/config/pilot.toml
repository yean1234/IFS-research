# 연구 파일럿 설정 (「IFS 이론이란?」 2절 모델 제안 기준)
# - 면담 모델: Gemma 4 31B. 응답 지연·메모리 문제가 있으면 gemma4:26b(MoE)로 내린다.
# - 가드: Kanana Safeguard 8B. 없으면 시작하지 않는다(required = true).
# - 버전 고정: 실행 시 Ollama digest(sha256)를 세션 로그에 남긴다. 태그 이름만 믿지 않는다.

[interview]
condition = "chatbot"
protocol = "elicitation_protocol.v1.3.json"
prompt_version = "1.0.0"

[llm]
backend = "ollama"
model = "gemma4:31b"
host = "http://127.0.0.1:11434"
timeout_s = 600
temperature = 0.2
top_p = 0.9
seed = 7
think = false
num_ctx = 8192
keep_alive = "60m"
max_regenerations = 2
retry_feedback = true

[guard]
keyword = true
model_backend = "ollama"
model = "hf.co/mradermacher/kanana-safeguard-8b-GGUF:Q4_K_M"
format = "kanana"
check_output = true
required = true

[validator]
strict_novel_content = true
l5_depth = "present_focus"
max_anchor_eojeol = 3         # (확장) 인용은 참여자의 낱말·짧은 구만. 문장 통째 인용 금지

[session]
log_dir = "logs"
scenes_dir = ""               # 장면 파일 scenes/{sessionId}.json. 비우면 logs/scenes (git에 올리지 않음)
researcher_contact = "(파일럿 전 연구자 연락처 입력)"

[mapping]
mode = "v1"                   # 확정 텍스트 → SceneSpec 매핑: v1(개선 매핑, 기본) | v0(규칙 기반 기준선)
save_both = true              # scenes/{sessionId}.v0.json · .v1.json도 저장(같은 텍스트를 두 매핑으로 — 비교 설계)
clarify_loop = false          # 확정 직후 what_kind 틀 확인 질문(최대 clarify_max회). 확증 비교에서는 끈다
clarify_max = 2
strict = true                 # v1을 요청했는데 시작 때 v1을 못 만들면 v0로 넘어가지 않고 시작을 멈춤(요청과 다른 매핑으로 세션을 돌리지 않음).
                              #   세션 도중 확정 시점의 v1 오류는 v0 대체 + meta.mapping + 연구자 알림(참여자 세션을 끊지 않음)

[drift]
enabled = true                # 확정 직후 단계별 스냅샷으로 심상 유지(표류) 판정 → 세션 로그 drift(참여자에게 안 보임)
recall_check = false          # Flesh out 뒤 회상 확인 문구. 확증 비교에서는 끈다. v1.1 이상 프로토콜 필요(v1.2 포함)
self_report = false           # 확정 직후 자기보고 1–7. 문구가 draft(IRB 검토 전). v1.1 이상 프로토콜 필요(v1.2 포함)
allow_draft_phrases = false   # 위 두 문구가 status = draft면 켜지 않고 경고. IRB·팀 검토를 거쳐 문구가 draft가 아닐 때만 켠다
